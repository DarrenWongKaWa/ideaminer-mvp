tasks:
  - id: 'build-mvp'
    title: '构建 IdeaMiner 网页端 MVP'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |-
      You are building IdeaMiner, a 丐版 (minimum viable) web app that replicates the
      IdeaMiner concept the user shared. The user wants:
      - A web app (NOT a WeChat mini-program — vanilla web is fine for MVP)
      - Input via voice AND text
      - 4-step workflow: discipline targeting -> idea generation -> 3-dim review -> interactive feedback
      - Well-defined interfaces for future extension (real LLM, backend API, etc.)
      - "丐版" means MINIMAL but WORKING — don't gold-plate, but ship something runnable

      ## Reference screenshots from the existing mini-program

      The user shared two screenshots. Replicate the visual style:
      - Clean white background, black header text, generous vertical spacing
      - Form fields are large with placeholder text ("选择您的学科", "例如：机器学习、量子计算", "请选择研究年龄")
      - Bottom nav has 3 items with emoji icons: 🧭探索 / 🗂️收藏 / 👤我的
      - Idea card uses emoji section headers: 📋问题背景 / 💡问题意义 / 🔬研究方法
      - 4 feedback buttons (rounded pill style): 不喜欢 / 不相关 / 喜欢 / 复制

      Screenshot 1 ("完善科研画像"): form with 领域 + 具体研究方向 + 研究年龄 + 继续 button.
      Screenshot 2 ("灵感探索"): one card with question + 3 sections + 4 feedback buttons.

      ## Project location

      Create EVERYTHING at: `/Users/wangjiahua/.minimax-agent-cn/projects/ideaminer-mvp/`

      Do NOT git init — that is a separate task. Just produce files.

      ## Tech stack (KEEP IT MINIMAL)

      - Vanilla HTML / CSS / JavaScript (NO React, NO npm install, NO build step)
      - Single-page app using hash-based routing
      - Web Speech API (`window.webkitSpeechRecognition`) for voice input
      - localStorage for persistence
      - Mock LLM responses — NO real API calls in MVP

      ## Required files

      ```
      ideaminer-mvp/
      ├── index.html                # SPA shell — single HTML that hosts all pages
      ├── css/
      │   └── style.css             # All styles, mobile-first (max-width: 480px, centered)
      ├── js/
      │   ├── app.js                # Router + app bootstrap
      │   ├── llm-provider.js       # LLMProvider interface + MockLLMProvider
      │   ├── storage.js            # Storage interface + LocalStorageProvider
      │   ├── reviewer.js           # 3-dim review logic
      │   ├── idea-generator.js     # IdeaGenerator orchestrator
      │   └── voice.js              # VoiceInput helper using Web Speech API
      ├── data/
      │   └── mock-ideas.json       # 12+ pre-canned ideas across 6+ fields
      ├── README.md                 # Architecture + how to run + how to extend
      └── .gitignore                # .DS_Store, node_modules, *.log
      ```

