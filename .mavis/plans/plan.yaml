      ## Behaviour spec

      ### index.html
      - Loads css/style.css, then js modules (use type=module so imports work over http)
      - Provides a single `<div id="app">` mount point
      - Bottom nav with 3 items (🧭探索 / 🗂️收藏 / 👤我的)
      - Page content rendered into `#app` based on hash route (#/profile, #/explore, #/saved, #/my)

      ### 完善科研画像 page (route #/profile)
      - 3 fields with placeholder text:
        - 领域 (select dropdown: 物理学 / 化学 / 生物学 / 计算机科学 / 数学 / 材料科学 / 地球科学 / 心理学 / 经济学 / 其他)
        - 具体研究方向 (text input, placeholder "例如：机器学习、量子计算")
        - 研究年龄 (select dropdown: 本科 / 硕士 / 博士 / 博士后 / 教授 / 其他)
      - Each text-style input has a 🎤 mic button next to it
      - Clicking mic starts voice recognition; interim result fills the field live; final result commits
      - "继续" button at the bottom — saves profile via Storage.setProfile, then routes to #/explore

      ### 灵感探索 page (route #/explore)
      - Header: "灵感探索" + subtitle "发现感兴趣的科研问题"
      - On mount: call IdeaGenerator.next(profile), show loading spinner for ~500ms
      - Render idea card with:
        - Title: the core question (large, bold)
        - 📋问题背景 section
        - 💡问题意义 section
        - 🔬研究方法 section (numbered list of methods)
        - Optional: small badge showing 创新 / 可行 / 重要 scores from review
      - 4 feedback buttons at bottom:
        - 不喜欢 (thumbs-down) — recordFeedback('dislike'), fetch next idea
        - 不相关 (no-entry) — recordFeedback('unrelated'), fetch next idea
        - 喜欢 (heart, red) — saveIdea + recordFeedback('like'), show "已收藏" toast, fetch next
        - 复制 (copy) — copy idea text to clipboard, show "已复制" toast
      - Bottom nav highlighted on 探索

      ### 收藏 page (route #/saved)
      - Header: "收藏"
      - Lists saved ideas from Storage.getSavedIdeas()
      - For 丐版: render as simple cards with title + question + delete button
      - Empty state: "还没有收藏的灵感"

      ### 我的 page (route #/my)
      - Header: "我的"
      - Shows current profile (if set)
      - Shows feedback history summary
      - "重新设置画像" button → routes back to #/profile

      ## Mock data

      `data/mock-ideas.json` must have at least 12 ideas covering 6+ fields, each with:
      ```json
      {
        "id": "idea-001",
        "field": "物理学",
        "question": "...",
        "background": "...",
        "significance": "...",
        "methods": ["...", "...", "..."]
      }
      ```

      Use the Rydberg-blockade example from the screenshot as ONE of them — write it in the same
      Chinese style as the screenshot. Vary the fields: include 物理学 (3 ideas), 化学 (2),
      生物学 (2), 计算机科学 (2), 数学 (2), 材料科学 (1).

      MockLLMProvider.generateIdea(profile, signal):
      1. Filter ideas array by `idea.field === profile.field` (fall back to all if no match)
      2. Pick random; if user has like-history, prefer ideas whose `field` matches the most-liked field
      3. Return a Promise that resolves after 400-800ms (use `await new Promise(r => setTimeout(r, ...))`)
      4. Strip the `id` and `field` from the draft before returning (those are bookkeeping)

      ## Voice input details

      ```js
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SR();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onresult = (e) => {
        const last = e.results[e.results.length - 1];
        onResult(last[0].transcript, last.isFinal);
      };
      recognition.onerror = (e) => onError(e.error || 'unknown');
      ```

      If `isSupported()` is false, hide the mic button (don't show error to user).

      ## README.md

      Include:
      1. One-paragraph project summary (what IdeaMiner is, what the MVP does)
      2. ASCII architecture diagram:
         ```
         ┌────────────────────────────────────────────────┐
         │  Browser (HTML/CSS/JS SPA)                      │
         │  ┌──────────┐   ┌──────────────────┐          │
         │  │ app.js   │──>│ IdeaGenerator    │          │
         │  │ (router) │   └──────┬───────────┘          │
         │  └──────────┘          │                       │
         │              ┌─────────┼──────────┐            │
         │              ▼         ▼          ▼            │
         │     LLMProvider  Reviewer    Storage          │
         │     (Mock impl)  (hash-based) (localStorage)  │
         └────────────────────────────────────────────────┘
         ```
      3. **How to run**: `cd ideaminer-mvp && python3 -m http.server 8080` then open http://localhost:8080
      4. **How to swap MockLLMProvider for a real LLM** — show the exact line in app.js to change, with a stub class implementing the same interface (so user knows the extension point)
      5. **Future roadmap** — list 4-6 extension points (real LLM, real auth, semantic search, agent community, etc.)
      6. **Known limitations of MVP**

      ## Style guidelines

      - Body font: system-ui, -apple-system, "Helvetica Neue", "PingFang SC", sans-serif
      - Page max-width: 480px, centered on desktop
      - Bottom nav: fixed at bottom, white background, top border, 3 evenly-spaced items
      - Idea card: white background, soft shadow, generous padding (24px), rounded corners (12px)
      - Section headers in idea card: emoji + 12px-14px font, 600 weight, gray
      - Body text: 15px, line-height 1.6, dark gray (#333)
      - Active feedback button (喜欢): red heart fill #ff3b30
      - Disabled/loading state: button opacity 0.6

      ## Stop condition

      You are DONE when:
      - All files in the required structure exist with real content (not stubs)
      - `python3 -m http.server 8080 --directory /Users/wangjiahua/.minimax-agent-cn/projects/ideaminer-mvp` serves the app
      - Opening http://localhost:8080 shows the profile form
      - Filling the form and clicking 继续 navigates to explore page
      - Explore page renders an idea card from mock data within 1 second
      - All 4 feedback buttons are wired (至少 recordFeedback is called)
      - Voice input is wired with proper Web Speech API usage
      - README explains how to extend

      After completing, write a `deliverable.md` at `/Users/wangjiahua/.minimax-agent-cn/projects/ideaminer-mvp/deliverable.md` with:
      - Files created (use `find . -type f | sort` and `wc -l` per file)
